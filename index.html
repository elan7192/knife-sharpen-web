<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:," />
  <meta name="theme-color" content="#1b2420" />
  <title>研刃 · 磨刀</title>
  <style>
    :root {
      --ink: #f3ede0;
      --muted: #b9b2a2;
      --panel: rgba(20, 24, 22, 0.62);
      --green: #5fd17a;
      --amber: #f2b24c;
      --red: #e2574c;
      --accent: #c8392b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #1b2420; color: var(--ink);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      touch-action: none; overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #hud {
      position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
      padding: calc(env(safe-area-inset-top) + 10px) 12px 0 12px;
      display: flex; flex-direction: column; gap: 8px; max-width: 520px;
    }
    .card { background: var(--panel); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .row { display: flex; align-items: center; gap: 10px; }
    .label { font-size: 14px; letter-spacing: 0.08em; min-width: 3.2em; color: var(--muted); }
    .value { font-size: 13px; min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
    .bar { position: relative; flex: 1; height: 12px; border-radius: 6px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .bar > .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 6px; }
    #sharpFill { background: linear-gradient(90deg, #8a8f96, #dfe6ee 70%, #ffffff); box-shadow: 0 0 8px rgba(255,255,255,0.4); }
    #pressZone { position: absolute; top: 0; bottom: 0; background: rgba(95, 209, 122, 0.35); border-left: 1px solid var(--green); border-right: 1px solid var(--green); }
    #pressFill { background: var(--amber); opacity: 0.9; }
    #pressFill.good { background: var(--green); }
    #pressFill.high { background: var(--red); }
    .ticks { position: absolute; inset: 0; pointer-events: none; }
    .ticks i { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.45); }

    #angleLight { width: 16px; height: 16px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); transition: background 0.12s, box-shadow 0.12s; flex: none; }
    #angleLight.good { background: var(--green); box-shadow: 0 0 12px var(--green); }
    #angleLight.near { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    #angleText { font-size: 15px; font-variant-numeric: tabular-nums; }
    #angleTarget { font-size: 12px; color: var(--muted); margin-left: auto; }

    #hint { font-size: 12px; color: var(--muted); text-align: center; padding: 0 4px; text-shadow: 0 1px 2px #000; }

    /* secondary angle control (second finger / mouse) */
    #angleSlider {
      position: fixed; right: calc(env(safe-area-inset-right) + 10px); top: 50%; transform: translateY(-50%);
      width: 46px; height: 42vh; max-height: 300px; border-radius: 23px; background: var(--panel);
      touch-action: none; pointer-events: auto;
    }
    #angleSlider .track { position: absolute; left: 50%; top: 18px; bottom: 18px; width: 4px; transform: translateX(-50%); background: rgba(255,255,255,0.2); border-radius: 2px; }
    #angleSlider .zone { position: absolute; left: -6px; right: -6px; background: rgba(95,209,122,0.45); border-radius: 3px; }
    #angleSlider .thumb { position: absolute; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #e9e2d2; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    #angleSlider .cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }

    #bottom {
      position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
      padding: 0 12px calc(env(safe-area-inset-bottom) + 8px) 12px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    button {
      pointer-events: auto; font: inherit; color: #fff; border: 0; cursor: pointer;
      background: var(--accent); border-radius: 999px; padding: 12px 34px; font-size: 18px; letter-spacing: 0.3em;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45); touch-action: manipulation;
    }
    button:active { transform: scale(0.96); }
    button.secondary { background: #3b4a43; }
    button:disabled { opacity: 0.45; }
    #credit { font-size: 10px; color: rgba(243, 237, 224, 0.6); text-shadow: 0 1px 2px #000; }

    #result {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
    }
    #result.show { display: flex; }
    #result .card { pointer-events: auto; text-align: center; padding: 18px 22px; max-width: min(88vw, 380px); background: rgba(16, 20, 18, 0.82); }
    #resultTitle { font-size: 26px; letter-spacing: 0.2em; margin: 0 0 8px; }
    #resultBody { font-size: 14px; line-height: 1.7; color: var(--muted); margin-bottom: 14px; }
    #resultBody b { color: var(--ink); }
    #result .row { justify-content: center; }

    #toast {
      position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none;
      font-size: 30px; letter-spacing: 0.25em; text-shadow: 0 2px 10px #000; opacity: 0; transition: opacity 0.25s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    .hidden { display: none !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="card">
      <div class="row">
        <span class="label">鋒利度</span>
        <div class="bar"><div class="fill" id="sharpFill"></div>
          <div class="ticks"><i style="left:20%"></i><i style="left:45%"></i><i style="left:70%"></i><i style="left:90%"></i></div>
        </div>
        <span class="value" id="sharpText">0%</span>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <span class="label">角度</span>
        <span id="angleLight"></span>
        <span id="angleText">25°</span>
        <span id="angleTarget">目標 15° ± 3°</span>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <span class="label">壓力</span>
        <div class="bar"><div id="pressZone"></div><div class="fill" id="pressFill"></div></div>
      </div>
    </div>
    <div id="hint">左右拖曳刀身磨刀・手指上下移動調整角度（或用右側滑桿 / 第二指 / 滑鼠滾輪）</div>
  </div>

  <div id="angleSlider" aria-label="角度">
    <span class="cap" style="top:2px">30°</span>
    <div class="track"><div class="zone"></div><div class="thumb"></div></div>
    <span class="cap" style="bottom:2px">0°</span>
  </div>

  <div id="toast"></div>

  <div id="result">
    <div class="card">
      <h2 id="resultTitle"></h2>
      <div id="resultBody"></div>
      <div class="row">
        <button id="againBtn" class="secondary">繼續磨</button>
        <button id="restartBtn">重來</button>
      </div>
    </div>
  </div>

  <div id="bottom">
    <button id="testBtn">試刀</button>
    <div id="credit">模型來源 threejsassets.com（免費商用授權）</div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
