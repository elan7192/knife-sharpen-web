<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:," />
  <meta name="theme-color" content="#F3EBDD" />
  <title>磨刀遊戲（原型）</title>
  <style>
    /* Palettes: /workspace/game-art/02-palettes.md (day = default, dusk via body.dusk, climax for the test cut) */
    :root {
      --ink: #2B2A28;
      --muted: rgba(43, 42, 40, 0.78);
      --panel: rgba(255, 255, 255, 0.8);
      --track: rgba(43, 42, 40, 0.14);
      --accent: #B04A33;
      --accent-ink: #FFFFFF;
      --hint-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
      --green: #3fae5c;
      --amber: #e09a2a;
      --red: #d2453a;
      --climax-bg: #0B0D12;
      --climax-ink: #F7F7F2;
      --climax-muted: #808C9A;
    }
    body.dusk {
      --ink: #F5EFE6;
      --muted: rgba(245, 239, 230, 0.78);
      --panel: rgba(31, 34, 48, 0.78);
      --track: rgba(245, 239, 230, 0.16);
      --accent: #E07A5F;
      --accent-ink: #1F2230;
      --hint-shadow: 0 1px 2px #000;
      --green: #5fd17a;
      --amber: #f2b24c;
      --red: #e2574c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #0B0D12; color: var(--ink);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      touch-action: none; overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #hud {
      position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
      padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 68px) 0 calc(env(safe-area-inset-left) + 12px);
      display: flex; flex-direction: column; gap: 8px; max-width: 520px;
    }
    .card { background: var(--panel); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .row { display: flex; align-items: center; gap: 10px; }
    .label { font-size: 14px; letter-spacing: 0.08em; min-width: 3.2em; color: var(--muted); }
    .value { font-size: 13px; min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
    .bar { position: relative; flex: 1; height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
    .bar > .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 6px; }
    #sharpFill { background: var(--accent); }
    #pressZone { position: absolute; top: 0; bottom: 0; background: rgba(95, 209, 122, 0.35); border-left: 2px solid var(--green); border-right: 2px solid var(--green); }
    #pressFill { background: var(--amber); opacity: 0.9; }
    #pressFill.good { background: var(--green); }
    #pressFill.high { background: var(--red); }
    .ticks { position: absolute; inset: 0; pointer-events: none; }
    .ticks i { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.45); }

    #angleLight { width: 16px; height: 16px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); transition: background 0.12s, box-shadow 0.12s; flex: none; }
    #angleLight.good { background: var(--green); box-shadow: 0 0 12px var(--green); }
    #angleLight.near { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    #angleText { font-size: 15px; font-variant-numeric: tabular-nums; }
    #angleText.good { color: var(--green); font-weight: 600; }
    #angleText.near { color: var(--amber); }
    #angleTarget { font-size: 12px; color: var(--muted); margin-left: auto; }
    #pressText { font-size: 12px; min-width: 2.4em; text-align: right; color: var(--muted); }
    /* edge coverage: one cell per blade segment (heel -> tip), fills and glows as it is polished */
    #edgeSegs { display: flex; flex-direction: row-reverse; /* heel on the right, like the knife on screen */ gap: 3px; margin-top: 6px; height: 10px; }
    #edgeSegs i { position: relative; flex: 1; border-radius: 2px; background: var(--track); overflow: hidden; }
    #edgeSegs i b { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: #9FB7C9; }
    #edgeSegs i.l1 b { background: #c9dbe8; } #edgeSegs i.l2 b { background: #dde9f2; }
    #edgeSegs i.l3 b, #edgeSegs i.l4 b { background: #E8F1F8; box-shadow: 0 0 6px #E8F1F8; }
    #edgeSegs i.cur { outline: 2px solid var(--accent); outline-offset: 0; }
    #edgeLabel { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }

    #hint { font-size: 13px; color: var(--ink); text-align: center; padding: 0 4px; text-shadow: var(--hint-shadow); }

    /* secondary angle control (second finger / mouse) */
    #angleSlider {
      position: fixed; right: calc(env(safe-area-inset-right) + 10px); top: 50%; transform: translateY(-50%);
      width: 52px; height: 42vh; min-height: 160px; max-height: 300px; border-radius: 23px; background: var(--panel);
      touch-action: none; pointer-events: auto;
    }
    #angleSlider .track { position: absolute; left: 50%; top: 18px; bottom: 18px; width: 4px; transform: translateX(-50%); background: var(--track); border-radius: 2px; }
    #angleSlider .zone { position: absolute; left: -6px; right: -6px; background: rgba(95,209,122,0.45); border-radius: 3px; }
    #angleSlider .thumb { position: absolute; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    #angleSlider .thumb.good { background: var(--green); }
    #angleSlider .thumb.near { background: var(--amber); }
    #angleSlider .cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }

    #bottom {
      position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
      padding: 0 calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    button {
      pointer-events: auto; font: inherit; color: var(--accent-ink); border: 0; cursor: pointer;
      background: var(--accent); border-radius: 999px; min-height: 48px; min-width: 96px; padding: 12px 34px; font-size: 18px; letter-spacing: 0.3em;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45); touch-action: manipulation;
    }
    button:active { transform: scale(0.96); }
    button.secondary { background: #3E4A61; color: #F5EFE6; }
    button:disabled { opacity: 0.45; }
    #credit { font-size: 10px; color: var(--muted); text-shadow: var(--hint-shadow); }

    #result {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
    }
    #result.show { display: flex; }
    #result .card { pointer-events: auto; text-align: center; padding: 18px 20px; width: min(92vw, 380px); background: rgba(11, 13, 18, 0.88); }
    #resultTitle { font-size: 34px; letter-spacing: 0.2em; margin: 0 0 8px; color: var(--climax-ink); }
    #resultBody { font-size: 14px; line-height: 1.7; color: var(--climax-muted); margin-bottom: 14px; }
    #resultBody b { color: var(--climax-ink); }
    #result .row { justify-content: center; flex-wrap: wrap; row-gap: 8px; }
    #result .row button.hidden { display: none; }
    /* Order-mode result: score + rank + breakdown */
    #resultScore { display: flex; align-items: baseline; justify-content: center; gap: 14px; margin: 2px 0 10px; color: var(--climax-ink); }
    #resultScore .rank { font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: 0; }
    #resultScore .rank.rS { color: #F4C95D; text-shadow: 0 0 18px rgba(244, 201, 93, 0.55); }
    #resultScore .rank.rA { color: #E8F1F8; } #resultScore .rank.rB { color: #9FB7C9; } #resultScore .rank.rC { color: #808C9A; }
    #resultScore .rank.rF { font-size: 34px; color: #9FB7C9; letter-spacing: 0.15em; }
    #resultScore .pts { font-size: 26px; font-variant-numeric: tabular-nums; }
    #resultScore .pts small { font-size: 14px; color: var(--climax-muted); margin-left: 2px; }
    .brk { text-align: left; font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
    .brk div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid rgba(128, 140, 154, 0.25); }
    .brk div span:first-child { color: var(--climax-muted); }
    .brk div span:last-child { color: var(--climax-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .brk div em { font-style: normal; color: var(--climax-muted); font-size: 11px; display: block; }

    /* Title / order screens (full-screen; they block the canvas only while shown) */
    .screen {
      position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
      background: rgba(11, 13, 18, 0.58); color: var(--climax-ink); pointer-events: none; touch-action: none;
    }
    .screen.show { display: flex; pointer-events: auto; }
    body.menu #hud, body.menu #bottom, body.menu #angleSlider, body.menu #stones { display: none; }
    #title h1 { margin: 0; font-size: 52px; letter-spacing: 0.3em; text-indent: 0.3em; font-weight: 700; text-shadow: 0 4px 24px #000; white-space: nowrap; }
    #title .sub { margin: 6px 0 2px; font-size: 13px; letter-spacing: 0.25em; color: var(--climax-muted); }
    #title .tag { margin: 14px 0 34px; font-size: 16px; letter-spacing: 0.15em; color: var(--climax-ink); opacity: 0.9; }
    .menu-btns { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: min(72vw, 260px); }
    .screen button, #result .row button, #actions button { white-space: nowrap; }
    .menu-btns button { font-size: 18px; letter-spacing: 0.2em; padding: 12px 18px; min-height: 52px; }
    #title .foot { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 10px); text-align: center; font-size: 11px; color: var(--climax-muted); }
    #order .card { background: rgba(11, 13, 18, 0.9); width: min(92vw, 380px); padding: 18px 20px; }
    #order .kicker { font-size: 12px; letter-spacing: 0.3em; color: var(--climax-muted); }
    #order h2 { margin: 4px 0 2px; font-size: 26px; letter-spacing: 0.1em; color: var(--climax-ink); }
    #order .from { font-size: 13px; color: var(--climax-muted); }
    #order .quote { margin: 12px 0; font-size: 15px; line-height: 1.6; color: var(--climax-ink); }
    #order dl { margin: 0 0 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
    #order dt { color: var(--climax-muted); white-space: nowrap; }
    #order dd { margin: 0; color: var(--climax-ink); }
    #order dd b { color: #F4C95D; font-size: 18px; }
    #order .row { justify-content: center; }
    #order .row button { font-size: 17px; letter-spacing: 0.12em; padding: 12px 20px; }
    @media (max-height: 520px) {
      #resultTitle { font-size: 24px; margin-bottom: 4px; }
      #resultScore { margin-bottom: 4px; } #resultScore .rank { font-size: 40px; }
      .brk { font-size: 12px; margin-bottom: 6px; } .brk div { padding: 1px 0; } .brk div em { display: inline; margin-left: 6px; }
      #title h1 { font-size: 40px; } #title .tag { margin: 8px 0 16px; }
      .menu-btns { flex-direction: row; width: auto; } #order .quote { margin: 6px 0; } #order dl { margin-bottom: 8px; }
    }
    #orderHud { font-size: 14px; padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #orderHud b { color: var(--accent); }
    #orderHud.ready b { color: var(--green); }
    #actions { display: flex; gap: 10px; align-items: center; }
    #menuBtn { min-width: 0; padding: 12px 14px; font-size: 15px; letter-spacing: 0.1em; }

    #toast {
      position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none;
      font-size: 30px; letter-spacing: 0.25em; color: var(--climax-ink); text-shadow: 0 2px 10px #000; opacity: 0; transition: opacity 0.25s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    /* Test-cut: cinematic bars. Sizes are set from main.js so the visible area is exactly 2.39:1. */
    .bar-cine { position: fixed; background: #000; pointer-events: none; width: 0; height: 0; }
    #cineTop { top: 0; left: 0; right: 0; width: auto; } #cineBottom { bottom: 0; left: 0; right: 0; width: auto; }
    #cineLeft { left: 0; top: 0; bottom: 0; height: auto; } #cineRight { right: 0; top: 0; bottom: 0; height: auto; }
    body.cine #bottom, body.cine #stones { opacity: 0; pointer-events: none; }
    body.cine #bottom * { pointer-events: none; }

    /* Whetstone toggles (left edge, mirrors the angle slider) */
    #stones {
      position: fixed; left: calc(env(safe-area-inset-left) + 10px); top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
    }
    #stones button {
      min-width: 0; width: 52px; min-height: 0; height: 58px; padding: 4px 0; border-radius: 14px; letter-spacing: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.3); border: 2px solid transparent;
    }
    #stones button b { font-size: 20px; line-height: 1; }
    #stones button small { font-size: 10px; opacity: 0.8; }
    #stones button i { width: 30px; height: 6px; border-radius: 3px; margin-top: 2px; }
    @media (max-height: 520px) {
      #stones { top: auto; transform: none; bottom: calc(env(safe-area-inset-bottom) + 8px); flex-direction: row; }
      #stones button { height: 52px; }
    }
    #stones button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,0.3); }

    /* Test-cut target chips */
    #targets { display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; max-width: 100%; }
    #targets button {
      min-width: 0; min-height: 44px; padding: 4px 10px; border-radius: 12px; font-size: 15px; letter-spacing: 0.05em;
      display: flex; flex-direction: column; align-items: center; line-height: 1.15;
      background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.3); border: 2px solid transparent;
    }
    #targets button small { font-size: 10px; opacity: 0.75; letter-spacing: 0; }
    #targets button.on { border-color: var(--accent); }
    #targets button.locked { opacity: 0.42; filter: grayscale(1); }
    #targets button.short small { color: var(--accent); opacity: 1; }
    #targets button.fresh { animation: fresh 0.9s ease-out 2; }
    @keyframes fresh { 50% { transform: scale(1.12); box-shadow: 0 0 16px var(--accent); } }
    #capMark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.7; }
    #result .row button { padding: 12px 16px; font-size: 16px; letter-spacing: 0.08em; min-width: 0; }
    #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
    .hidden { display: none !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="orderHud" class="card hidden"></div>
    <div class="card">
      <div class="row">
        <span class="label">鋒利度</span>
        <div class="bar"><div class="fill" id="sharpFill"></div>
          <div class="ticks" id="sharpTicks"></div><div id="capMark"></div>
        </div>
        <span class="value" id="sharpText">0%</span>
      </div>
      <div id="edgeSegs" aria-label="刃口進度"></div>
      <div id="edgeLabel"><span>刀尖</span><span>刃口亮線</span><span>刃根</span></div>
    </div>
    <div class="card">
      <div class="row">
        <span class="label">角度</span>
        <span id="angleLight"></span>
        <span id="angleText">26°</span>
        <span id="angleTarget">目標 15°–20°</span>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <span class="label">壓力</span>
        <div class="bar"><div id="pressZone"></div><div class="fill" id="pressFill"></div></div>
        <span id="pressText"></span>
      </div>
    </div>
    <div id="hint">單指左右拖曳磨刀・上下移動調角度（或右側滑桿 / 第二指 / 滾輪）</div>
  </div>

  <div id="angleSlider" aria-label="角度">
    <span class="cap" style="top:2px">30°</span>
    <div class="track"><div class="zone"></div><div class="thumb"></div></div>
    <span class="cap" style="bottom:2px">0°</span>
  </div>

  <div id="stones" aria-label="砥石"></div>

  <div id="cineTop" class="bar-cine"></div>
  <div id="cineBottom" class="bar-cine"></div>
  <div id="cineLeft" class="bar-cine"></div>
  <div id="cineRight" class="bar-cine"></div>
  <div id="flash"></div>
  <div id="toast"></div>

  <div id="result">
    <div class="card">
      <h2 id="resultTitle"></h2>
      <div id="resultScore" class="hidden"></div>
      <div id="resultBody"></div>
      <div class="row">
        <button id="againBtn" class="secondary">繼續磨</button>
        <button id="nextBtn">再切一次</button>
        <button id="restartBtn" class="secondary">重來</button>
        <button id="retryBtn" class="hidden">再磨一下</button>
        <button id="nextOrderBtn" class="hidden">下一個委託</button>
        <button id="titleBtn" class="secondary hidden">回標題</button>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="targets" aria-label="試刀目標"></div>
    <div id="actions">
      <button id="menuBtn" class="secondary" aria-label="回標題畫面">標題</button>
      <button id="testBtn">試刀</button>
    </div>
    <div id="credit">場景與刀皆為程式生成・無外部素材</div>
  </div>

  <div id="title" class="screen show" aria-label="標題畫面">
    <h1>磨刀</h1>
    <div class="sub">原型・暫定名稱</div>
    <div class="tag">慢慢磨，一刀切開。</div>
    <div class="menu-btns">
      <button id="startBtn">開始</button>
      <button id="freeBtn" class="secondary">自由磨刀</button>
    </div>
    <div class="foot">場景與刀皆為程式生成・無外部素材</div>
  </div>

  <div id="order" class="screen" aria-label="委託">
    <div class="card">
      <div class="kicker" id="orderNo">委託</div>
      <h2 id="orderName"></h2>
      <div class="from" id="orderFrom"></div>
      <div class="quote" id="orderLine"></div>
      <dl>
        <dt>刀</dt><dd id="orderKnife"></dd>
        <dt>試刀要求</dt><dd id="orderTarget"></dd>
      </dl>
      <div class="row">
        <button id="orderBackBtn" class="secondary">回標題</button>
        <button id="acceptBtn">接下委託</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
